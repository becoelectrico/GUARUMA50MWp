<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma Guaruma 50 MW</title>
<meta name="theme-color" content="#0A2A55">
<meta name="description" content="Plataforma de seguimiento del Proyecto Solar Guaruma 50 MW · EHGSA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..750&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* Layout: navy sidebar (collapsible) + light work surface; signature = project timeline of fronts on the cover page */
:root{
  --navy:#0A2A55; --navy-2:#0E3670; --navy-ink:#C9D6EA; --navy-mute:#7F96BC;
  --orange:#F07A0A; --blue:#1F5BC4; --green:#2F9447; --amber:#C98500; --red:#C8372D;
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#DDE3EC; --line-2:#E9EDF3;
  --ink:#13223A; --ink-2:#4A5A73; --ink-3:#7A889E;
  --ok:#2F9447; --ok-bg:#E6F4E9; --info:#1F5BC4; --info-bg:#E7EEFB; --warn:#A86F00; --warn-bg:#FCF1DA; --bad:#C2352B; --bad-bg:#FBE7E5; --mute:#6B7890; --mute-bg:#EDF0F5; --hold:#6A51B5; --hold-bg:#EEEAF9;
  --track:#E4E9F0; --shadow:0 1px 2px rgba(10,42,85,.06),0 4px 16px rgba(10,42,85,.05);
  --font:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --sbw:252px; --sbw-c:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1422; --surface:#111D30; --surface-2:#0F1A2B; --line:#22324B; --line-2:#1A2840;
  --ink:#E6ECF5; --ink-2:#A9B6CA; --ink-3:#7D8BA2; --navy:#071A35; --navy-2:#0C2547;
  --ok:#5CC373; --ok-bg:#163223; --info:#6E9EF0; --info-bg:#16284A; --warn:#E3A932; --warn-bg:#3A2C10; --bad:#F07368; --bad-bg:#3F1D1C; --mute:#93A0B5; --mute-bg:#1B273A; --hold:#A893EA; --hold-bg:#271F42;
  --track:#1D2B42; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1422; --surface:#111D30; --surface-2:#0F1A2B; --line:#22324B; --line-2:#1A2840;
  --ink:#E6ECF5; --ink-2:#A9B6CA; --ink-3:#7D8BA2; --navy:#071A35; --navy-2:#0C2547;
  --ok:#5CC373; --ok-bg:#163223; --info:#6E9EF0; --info-bg:#16284A; --warn:#E3A932; --warn-bg:#3A2C10; --bad:#F07368; --bad-bg:#3F1D1C; --mute:#93A0B5; --mute-bg:#1B273A; --hold:#A893EA; --hold-bg:#271F42;
  --track:#1D2B42; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-variation-settings:"wdth" 100}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px;border-radius:4px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100%;transition:grid-template-columns .22s ease}
.app.collapsed{grid-template-columns:var(--sbw-c) minmax(0,1fr)}
.sb{background:var(--navy);color:var(--navy-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:30;padding-top:env(safe-area-inset-top,0px)}
.sb-brand{display:flex;align-items:center;gap:12px;padding:18px 16px 14px}
.sb-brand img{width:36px;height:36px;object-fit:contain;flex:none;background:#fff;border-radius:9px;padding:3px}
.sb-name{display:grid;line-height:1.15;white-space:nowrap}
.sb-name b{font-size:15px;color:#fff;font-weight:650;font-variation-settings:"wdth" 112;letter-spacing:.01em}
.sb-name span{font-size:12px;color:var(--navy-mute)}
.sb-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 10px 12px;scrollbar-width:thin;scrollbar-color:var(--navy-2) transparent}
.sb-group{font-size:11.5px;color:var(--navy-mute);padding:14px 10px 6px;white-space:nowrap}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--navy-ink);text-align:left;cursor:pointer;text-decoration:none;white-space:nowrap;position:relative}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.nav[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.nav .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav .cnt{font-size:11.5px;color:var(--navy-mute);font-variant-numeric:tabular-nums}
.nav .chev{width:14px;height:14px;transition:transform .2s}
.nav[aria-expanded="true"] .chev{transform:rotate(90deg)}
.sub{display:grid;gap:1px;padding:2px 0 4px 20px;border-left:1px solid rgba(255,255,255,.1);margin-left:19px}
.sub[hidden]{display:none}
.sub .nav{padding:6px 10px;font-size:13px;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--mute)}
.sb-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.sync{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--navy-mute);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#E3A932;flex:none;box-shadow:0 0 0 3px rgba(227,169,50,.18)}
.user{display:flex;align-items:center;gap:10px;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--navy-2);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:650;flex:none}
.user div{display:grid;line-height:1.2;font-size:12.5px}.user span{color:var(--navy-mute);font-size:11.5px}
.collapsed .sb-name,.collapsed .sb-group,.collapsed .nav .lbl,.collapsed .nav .cnt,.collapsed .nav .chev,.collapsed .sub,.collapsed .sync span,.collapsed .user div{display:none}
.collapsed .nav{justify-content:center;padding:9px}
.collapsed .sb-brand{justify-content:center;padding-inline:0}
.collapsed .sync,.collapsed .user{justify-content:center}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.iconbtn{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink-2)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);min-width:0;flex:1;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:0 10px;height:36px;width:min(280px,32vw)}
.search svg{width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:1.8;flex:none}
.search input{border:0;background:none;outline:none;color:var(--ink);font:inherit;width:100%;min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:550;white-space:nowrap}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.proto{margin:14px max(20px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));border:1px dashed var(--line);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink-2);display:flex;gap:10px;align-items:center;background:var(--surface-2)}
.proto b{color:var(--ink)}
.view{padding:20px max(20px,env(safe-area-inset-right,0px)) 48px max(20px,env(safe-area-inset-left,0px));display:grid;gap:20px;align-content:start;max-width:1440px;width:100%}
.scrim{display:none}

/* ---------- Type ---------- */
h1,h2,h3{margin:0;text-wrap:balance}
.h1{font-size:clamp(22px,2.6vw,30px);font-weight:650;font-variation-settings:"wdth" 118;letter-spacing:-.005em;line-height:1.1}
.h2{font-size:16px;font-weight:620;font-variation-settings:"wdth" 108}
.h3{font-size:14px;font-weight:600}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}
.small{font-size:12.5px}

/* ---------- Panels ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.ph p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.pb{padding:16px 18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:20px}

/* ---------- Status ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--mute-bg);color:var(--mute)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-bg);color:var(--ok)} .s-info{background:var(--info-bg);color:var(--info)} .s-warn{background:var(--warn-bg);color:var(--warn)} .s-bad{background:var(--bad-bg);color:var(--bad)} .s-hold{background:var(--hold-bg);color:var(--hold)} .s-mute{background:var(--mute-bg);color:var(--mute)}
.d-ok{background:var(--ok)}.d-info{background:var(--info)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}.d-hold{background:var(--hold)}.d-mute{background:var(--mute)}
.meter{height:8px;border-radius:999px;background:var(--track);overflow:hidden;display:flex}
.meter>span{height:100%}
.meter.thin{height:6px}

/* ---------- Cover header ---------- */
.cover{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end}
.cover .loc{margin-top:6px;color:var(--ink-2);font-size:13.5px}
.status-card{display:grid;gap:6px;justify-items:end;text-align:right;max-width:420px}
.status-card p{margin:0;font-size:12.5px;color:var(--ink-2)}

/* KPI band */
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.kpi{padding:16px 18px;display:grid;gap:6px;align-content:start;border-right:1px solid var(--line-2)}
.kpi:last-child{border-right:0}
.kpi .k{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:620;font-variation-settings:"wdth" 110;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .v small{font-size:14px;font-weight:550;color:var(--ink-2);margin-right:4px}
.kpi .n{font-size:12px;color:var(--ink-3)}
@media (max-width:900px){.kpi{border-right:0;border-bottom:1px solid var(--line-2)}}

/* Timeline */
.tl{position:relative;padding:8px 18px 16px;overflow-x:auto}
.tl-in{min-width:760px;position:relative}
.tl-axis{display:grid;grid-template-columns:200px 1fr;font-size:11.5px;color:var(--ink-3);border-bottom:1px solid var(--line-2);padding-bottom:6px;margin-bottom:6px}
.tl-months{position:relative;height:16px}
.tl-months span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tl-row{display:grid;grid-template-columns:200px 1fr;align-items:center;min-height:34px;border-radius:6px;cursor:pointer}
.tl-row:hover{background:var(--surface-2)}
.tl-name{display:flex;align-items:center;gap:8px;font-size:13px;padding-left:4px;overflow:hidden;white-space:nowrap}
.tl-name span{overflow:hidden;text-overflow:ellipsis}
.tl-track{position:relative;height:34px}
.tl-bar{position:absolute;top:10px;height:14px;border-radius:4px;opacity:.9}
.tl-bar.open{background-image:repeating-linear-gradient(90deg,currentColor 0 6px,transparent 6px 10px)!important;background-color:transparent!important;height:3px;top:15.5px;opacity:.7}
.tl-dia{position:absolute;top:11px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);border-radius:2px;border:2px solid var(--surface)}
.tl-none{position:absolute;top:9px;left:4px;font-size:12px;color:var(--ink-3)}
.tl-today{position:absolute;top:-4px;bottom:0;width:0;border-left:1.5px solid var(--orange);pointer-events:none;z-index:2}
.tl-today b{position:absolute;bottom:-2px;left:5px;background:var(--surface);padding:0 3px;border-radius:3px;font-size:11px;color:var(--orange);font-weight:650;white-space:nowrap}
.tl-grid{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line-2);pointer-events:none}
.tl-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-3);padding:0 18px 14px}
.tl-legend span{display:inline-flex;align-items:center;gap:6px}
.lg-bar{width:18px;height:8px;border-radius:2px;background:var(--info)}
.lg-open{width:18px;height:3px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 5px,transparent 5px 8px)}
.lg-dia{width:9px;height:9px;transform:rotate(45deg);background:var(--ink-3);border-radius:1px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--ink-2);font-size:12px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.t td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--surface-2)}
.t .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.t .nowrap{white-space:nowrap}
.fname{display:flex;align-items:center;gap:10px;font-weight:580}
.fname .id{font-size:11.5px;color:var(--ink-3);font-weight:500;font-variant-numeric:tabular-nums}
.minibar{display:grid;gap:4px;min-width:130px}
.minibar .small{display:flex;justify-content:space-between;gap:8px;color:var(--ink-3)}

/* Lists */
.list{display:grid}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:12px 18px;border-bottom:1px solid var(--line-2);align-items:start}
.li:last-child{border-bottom:0}
.li .when{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:62px;color:var(--ink-2)}
.li .when.late{color:var(--bad)}
.li .what{font-size:13.5px}
.li .who{grid-column:2/-1;font-size:12.5px;color:var(--ink-3)}
.tag{display:inline-block;font-size:11.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:6px;font-variant-numeric:tabular-nums}

/* Frente detail */
.fhead{display:grid;gap:10px}
.fhead .row{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:0}
.fact{padding:14px 18px;border-right:1px solid var(--line-2);display:grid;gap:4px}
.fact:last-child{border-right:0}
.fact .k{font-size:12px;color:var(--ink-3)}
.fact .v{font-size:17px;font-weight:620;font-variant-numeric:tabular-nums;font-variation-settings:"wdth" 108}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:550}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.tab .c{font-size:11.5px;color:var(--ink-3);margin-left:4px}
.path{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.path svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}

/* Payments */
.pay{display:flex;gap:3px;height:26px}
.pay>div{border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap;cursor:default}
.pay .paid{background:var(--ok);color:#fff}
.pay .pend{background:var(--track);color:var(--ink-2)}
.pay .na{background:repeating-linear-gradient(135deg,var(--track) 0 6px,transparent 6px 10px);color:var(--ink-3);border:1px solid var(--line-2)}

/* Docs */
.docs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);min-height:420px}
.doclist{border-right:1px solid var(--line-2);overflow:auto;max-height:560px}
.doc{display:grid;grid-template-columns:32px minmax(0,1fr);gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;align-items:center;border-left:3px solid transparent}
.doc:hover{background:var(--surface-2)}
.doc.on{background:var(--surface-2);border-left-color:var(--orange)}
.ext{width:32px;height:32px;border-radius:7px;display:grid;place-items:center;font-size:10px;font-weight:700;grid-row:span 2;color:#fff;letter-spacing:.02em}
.x-pdf{background:#C8372D}.x-docx{background:#2B5DB8}.x-xlsx{background:#1F7A44}.x-pptx{background:#C8561B}.x-dwg{background:#5B4AA8}.x-other{background:#6B7890}
.doc .dn{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc .dm{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{display:grid;place-items:center;padding:24px;background:var(--surface-2);text-align:center}
.preview .sheet{width:min(100%,360px);aspect-ratio:8.5/11;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);display:grid;align-content:start;gap:10px;padding:22px;text-align:left}
.preview .sheet i{display:block;height:7px;border-radius:3px;background:var(--track)}
@media (max-width:860px){.docs{grid-template-columns:1fr}.doclist{border-right:0;border-bottom:1px solid var(--line-2);max-height:320px}}



/* Plazos gantt */
.pz{padding:8px 18px 6px;overflow-x:auto}
.pz-in{min-width:820px}
.pz-axis{display:grid;grid-template-columns:230px 1fr 150px;font-size:11.5px;color:var(--ink-3);border-bottom:1px solid var(--line-2);padding-bottom:6px}
.pz-row{display:grid;grid-template-columns:230px 1fr 150px;align-items:center;min-height:50px;border-bottom:1px solid var(--line-2);cursor:pointer}
.pz-row:last-child{border-bottom:0}
.pz-row:hover{background:var(--surface-2)}
.pz-name{display:grid;gap:1px;padding:6px 8px 6px 4px;font-size:13px;min-width:0}
.pz-name b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pz-name span{font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pz-track{position:relative;height:50px}
.pz-c{position:absolute;top:13px;height:12px;border-radius:3px}
.pz-c.sup{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px)}
.pz-max{position:absolute;top:13px;height:12px;border-radius:0 3px 3px 0;background:repeating-linear-gradient(90deg,currentColor 0 4px,transparent 4px 7px);opacity:.45}
.pz-a{position:absolute;top:31px;height:6px;border-radius:3px;border:1.5px solid var(--ink-3);background:transparent}

<script>
(() => {
// ================= Configuración =================
const CFG = {
  clientId: 'f6cd3474-bcc7-4387-8046-30157ab7704f',
  tenantId: '79702418-9618-4959-9b30-5ccee5296be9',

  root: 'Proyecto CAHSA 50 MW',
  master: '00_Plataforma/Plataforma_Guaruma.xlsx',
  scopes: ['User.Read', 'Files.ReadWrite']
};
const GRAPH = 'https://graph.microsoft.com/v1.0';
const CACHE_KEY = 'guaruma.data.v1';
let DATA = null, META = null, ACCOUNT = null, BASE = `/drives/${CFG.driveId}`;
const t0 = new Date(); const TODAY = new Date(t0 - t0.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fd = (s, y) => { if (!s) return '—'; const [Y, M, D] = s.split('-'); return `${+D} ${MES[+M - 1]}` + (y ? ` ${Y}` : ''); };
const nf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nf0 = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const money = (m, c) => m == null || m === '' ? '—' : (c === 'HNL' ? 'L ' : 'US$ ') + nf.format(m);
const usd = (m, c) => m == null ? 0 : (c === 'HNL' ? m / FX : m);
const ICON = {
  home: '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
  layers: '<path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/>',
  contract: '<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/><path d="M10 13h6M10 17h4"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  alert: '<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>',
  report: '<path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  folder: '<path d="M3 6h6l2 2h10v11H3z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  chev: '<path d="m9 6 6 6-6 6"/>', plus: '<path d="M12 5v14M5 12h14"/>', ext: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v6H4V6h6"/>', edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>'
};
const ic = (n, cls = '') => `<svg viewBox="0 0 24 24" class="${cls}">${ICON[n]}</svg>`;

// Status → tone
const TONE = {
  'En tiempo':'ok','Completado':'ok','Cerrada':'ok','Firmado':'ok','Pagado':'ok','Adjudicada':'ok','Cumplido':'ok','Tomada':'ok','Mitigado':'ok','Cerrado':'ok','Terminado':'ok',

  'Atención':'warn','Pendiente':'warn','Medio':'warn','Solicitada':'warn','Abierto':'warn',

  'No iniciado':'mute','No aplica aún':'mute','Reemplazada':'mute','Bajo':'mute','Anulado':'mute','Cancelado':'mute'

const tone = (s) => TONE[s] || 'mute';
const pill = (s, tip) => `<span class="pill s-${tone(s)}"${tip ? ` data-tip="${esc(tip)}"` : ''}>${esc(s)}</span>`;
const ext = (n) => { const e = (n.split('.').pop() || '').toLowerCase(); const map = { pdf: 'pdf', docx: 'docx', doc: 'docx', xlsx: 'xlsx', pptx: 'pptx', dwg: 'dwg' }; return [map[e] || 'other', e.slice(0, 4).toUpperCase()]; };

let P = {}, FX = 27.0272, F = [], C = [], PG = [], O = [], A = [], R = [], DC = [], INF = [], BIT = [], PRES = [], PZ = [], AS = [], fById = {};
function applyData(D) {
  DATA = D; P = D.Proyecto || {}; FX = Number(P['Tasa de cambio de referencia (L por US$)']) || 27.0272;
  F = D.Frentes || []; C = D.Contratos || []; PG = D.Pagos || []; O = D.Ofertas || []; A = D.Actividades || []; R = D.Riesgos || []; DC = D.Pendientes || []; INF = D.Informes || []; BIT = D['Bitácora'] || []; PRES = D.Presupuesto || []; PZ = (D.Plazos || []).map((p) => ({ ...p })); AS = D['Cronograma Asana'] || [];
  fById = Object.fromEntries(F.map((f) => [f.ID, f]));
}
const contractsOf = (id) => C.filter((c) => c.Frente === id);
const paysOf = (n) => PG.filter((p) => p.Contrato === n);
const fin = (id) => {
  const cs = contractsOf(id).filter((c) => c.Estado !== 'Borrador' && c.Estado !== 'Anulado');
  let tot = 0, paid = 0; cs.forEach((c) => { tot += usd(c.Monto, c.Moneda); paysOf(c['N.º']).forEach((p) => { if (p.Estado === 'Pagado') paid += usd(p.Monto, p.Moneda); }); });
  return { tot, paid, n: cs.length };
};

// ---------- Nav ----------
const ROUTES = [
  ['resumen', 'Resumen', 'home'], ['frentes', 'Frentes', 'layers'], ['contratos', 'Contratos y pagos', 'contract'], ['ofertas', 'Ofertas', 'tag'],
  ['cronograma', 'Cronograma', 'cal'], ['pendientes', 'Pendientes y riesgos', 'alert'], ['informes', 'Informes semanales', 'report'], ['documentos', 'Documentos', 'folder'], ['bitacora', 'Bitácora', 'clock']
];
let frOpen = true;

  const nav = $('#nav');
  const grp = (t) => `<div class="sb-group">${t}</div>`;

// ---------- Timeline ----------
function timeline(rows) {

const DOCSTATE = {}; // key: base path -> { rel, items, sel, pv }
const PREVIEWABLE = /\.(pdf|docx?|xlsx?|pptx?|csv|txt|rtf|odt|ods|odp|png|jpe?g|gif|bmp|tiff?|heic|mp4|mov)$/i;
const IMG = /\.(png|jpe?g|gif|bmp|tiff?|heic|webp)$/i;
const extOf = (n, isDir) => { if (isDir) return ['dir', '']; if (IMG.test(n)) return ['img', (n.split('.').pop() || '').slice(0, 4).toUpperCase()]; return ext(n); };
const fsize = (b) => b == null ? '' : b < 1048576 ? Math.max(1, Math.round(b / 1024)) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
function docBox(baseRel, label) {
  return `<section class="panel" id="docbox" data-base="${esc(baseRel || '')}" data-label="${esc(label || CFG.root)}"><div class="loading"><span class="spin"></span>Cargando carpeta de OneDrive…</div></section>`;
}
async function mountDocs() {
  const box = document.getElementById('docbox'); if (!box) return;
  const base = box.dataset.base, label = box.dataset.label;
  const st = DOCSTATE[base] || (DOCSTATE[base] = { rel: '', items: null, sel: null, pv: null, err: null });
  if (!st.items && !st.err) {
    try { st.items = await listFolder(joinRel(base, st.rel)); } catch (e) { st.err = e.message; }
  }
  if (document.getElementById('docbox') !== box) return;
  drawDocs(box, st, base, label);
}
const joinRel = (a, b) => [a, b].filter(Boolean).join('/');
function drawDocs(box, st, base, label) {
  const parts = st.rel ? st.rel.split('/') : [];
  const crumbs = [`<button type="button" data-dnav="">${esc(label)}</button>`].concat(parts.map((p, i) => `<span>/</span><button type="button" data-dnav="${esc(parts.slice(0, i + 1).join('/'))}">${esc(p)}</button>`)).join('');
  let list;
  if (st.err) list = `<div class="err-box">No se pudo leer la carpeta: ${esc(st.err)}</div>`;
  else if (!st.items) list = '<div class="loading"><span class="spin"></span>Cargando…</div>';
  else if (!st.items.length) list = '<div class="empty">Esta carpeta está vacía.</div>';
  else list = st.items.map((x) => { const [k, e] = extOf(x.name, !!x.folder);
    return `<div class="doc ${st.sel && st.sel.id === x.id ? 'on' : ''}" data-ditem="${x.id}" tabindex="0"><span class="ext x-${k}">${x.folder ? '<svg viewBox="0 0 24 24" width="16" height="16" style="stroke:#fff;fill:none;stroke-width:1.8"><path d="M3 6h6l2 2h10v11H3z"/></svg>' : e}</span><span class="dn" title="${esc(x.name)}">${esc(x.name)}</span><span class="dm">${x.folder ? x.folder.childCount + ' elementos' : fd(x.lastModifiedDateTime.slice(0, 10), 1) + ' · ' + fsize(x.size)}</span></div>`; }).join('');
  let pv;
  if (!st.sel) pv = `<div class="preview" style="display:grid;place-items:center"><div class="small muted" style="max-width:320px;text-align:center">Elige un archivo para verlo aquí. PDF, Word, Excel, PowerPoint e imágenes se muestran dentro de la plataforma.</div></div>`;
  else {
    const x = st.sel;
    const bar = `<div class="pv-bar"><b title="${esc(x.name)}">${esc(x.name)}</b><span style="display:flex;gap:6px">${x.webUrl ? `<a class="btn sm" href="${esc(x.webUrl)}" target="_blank" rel="noopener">${ic('ext')}Abrir en OneDrive</a>` : ''}<button class="btn sm" type="button" data-dl="${x.id}">Descargar</button></span></div>`;
    let inner;
    if (st.pv === 'loading') inner = '<div class="loading"><span class="spin"></span>Preparando vista previa…</div>';
    else if (st.pv && st.pv.url) inner = `<iframe src="${esc(st.pv.url)}" title="${esc(x.name)}" allowfullscreen></iframe>`;
    else if (st.pv && st.pv.err) inner = `<div class="empty">${esc(st.pv.err)}</div>`;
    else inner = `<div class="empty">Este tipo de archivo no tiene vista previa. Descárgalo o ábrelo en OneDrive.</div>`;
    pv = `<div class="pv-wrap">${bar}<div class="preview">${inner}</div></div>`;
  }
  box.innerHTML = `<div class="ph"><div><h2 class="h2">Documentos</h2><p>En vivo desde OneDrive · ${esc(joinRel(CFG.root, joinRel(base, st.rel)))}</p></div><span style="display:flex;gap:8px"><button class="btn sm" type="button" data-dreload="1">Actualizar</button><button class="btn sm" aria-disabled="true" data-tip="Disponible en la fase 3">${ic('plus')}Subir archivo</button></span></div>
    <div class="dcrumbs">${crumbs}</div><div class="docs"><div class="doclist">${list}</div>${pv}</div>`;
}
async function docsClick(e) {
  const box = document.getElementById('docbox'); if (!box) return false;
  const base = box.dataset.base, label = box.dataset.label, st = DOCSTATE[base]; if (!st) return false;
  const nav = e.target.closest('[data-dnav]');
  if (nav) { const rel = nav.dataset.dnav; if (rel === st.rel) return true; st.rel = rel; st.items = null; st.err = null; st.sel = null; st.pv = null; drawDocs(box, st, base, label); try { st.items = await listFolder(joinRel(base, rel)); } catch (er) { st.err = er.message; } drawDocs(box, st, base, label); return true; }
  if (e.target.closest('[data-dreload]')) { st.items = null; st.err = null; drawDocs(box, st, base, label); try { st.items = await listFolder(joinRel(base, st.rel)); } catch (er) { st.err = er.message; } drawDocs(box, st, base, label); return true; }
  const dl = e.target.closest('[data-dl]');
  if (dl) { try { const r = await graph(`${BASE}/items/${dl.dataset.dl}`); const u = r['@microsoft.graph.downloadUrl']; if (u) location.href = u; } catch (er) { toast('No se pudo descargar: ' + er.message); } return true; }
  const it = e.target.closest('[data-ditem]');
  if (it) {
    const x = (st.items || []).find((y) => y.id === it.dataset.ditem); if (!x) return true;
    if (x.folder) { st.rel = joinRel(st.rel, x.name); st.items = null; st.sel = null; st.pv = null; drawDocs(box, st, base, label); try { st.items = await listFolder(joinRel(base, st.rel)); } catch (er) { st.err = er.message; } drawDocs(box, st, base, label); return true; }
    st.sel = x;
    if (!PREVIEWABLE.test(x.name)) { st.pv = null; drawDocs(box, st, base, label); return true; }
    st.pv = 'loading'; drawDocs(box, st, base, label);
    try { const r = await graph(`${BASE}/items/${x.id}/preview`, { method: 'POST', body: '{}' }); st.pv = { url: r.getUrl }; }
    catch (er) { st.pv = { err: 'No se pudo generar la vista previa (' + er.message + ').' }; }
    if (st.sel === x) drawDocs(box, st, base, label);
    return true;
  }
  return false;
}
async function listFolder(rel) {
  const path = encPath(joinRel(CFG.root, rel));
  const r = await graph(`${BASE}/root:/${path}:/children?$top=999&$select=id,name,size,folder,file,webUrl,lastModifiedDateTime`);
  return (r.value || []).filter((x) => !/^(thumbs\.db|~\$|desktop\.ini)/i.test(x.name))
    .sort((a, b) => (!!b.folder - !!a.folder) || a.name.localeCompare(b.name, 'es', { numeric: true }));
}

  if (route.startsWith('frente-')) { const id = route.slice(7); html = vFrente(id); crumb = `<span>Frentes</span>${ic('chev').replace('<svg', '<svg width="12" height="12" style="stroke:currentColor;fill:none;stroke-width:2"')}<b>${esc(fById[id]?.Frente || '')}</b>`; }
  else { if (!views[route]) route = 'resumen'; html = views[route](); crumb = `<span>Guaruma 50 MW</span>${ic('chev').replace('<svg', '<svg width="12" height="12" style="stroke:currentColor;fill:none;stroke-width:2"')}<b>${(ROUTES.find((r) => r[0] === route) || ROUTES.find((r) => r[0] === 'pendientes'))[1]}</b>`; }
  $('#view').innerHTML = html; $('#crumbs').innerHTML = crumb; drawNav(route);
  $('#app').classList.remove('mopen');
  mountDocs();
}
let lastRoute = '';
window.addEventListener('hashchange', () => { const r = location.hash; if (r !== lastRoute) { fTab = 'resumen'; docSel = 0; lastRoute = r; } render(); window.scrollTo({ top: 0 }); });
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]'); if (go && !e.target.closest('a,button')) { location.hash = go.dataset.go; return; }
  const ft = e.target.closest('[data-ftab]'); if (ft) { fTab = ft.dataset.ftab; docSel = 0; render(); return; }
  if (e.target.closest('[data-asana-cfg],[data-asana-save],[data-asana-del]')) { asanaClick(e); return; }
  if (e.target.closest('#docbox')) { docsClick(e); }
  const of = e.target.closest('[data-openfolder]'); if (of) { openFolderWeb(of.dataset.openfolder); return; }
  const ac = e.target.closest('[data-acc]'); if (ac) { document.querySelectorAll('details.grp').forEach((d) => { d.open = ac.dataset.acc === 'open'; }); return; }
  if (e.target.closest('[aria-disabled="true"]')) e.preventDefault();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.closest?.('[data-ditem]')) { e.target.click(); } });
$('#tg').onclick = () => { if (matchMedia('(max-width:860px)').matches) $('#app').classList.toggle('mopen'); else $('#app').classList.toggle('collapsed'); };
$('#scrim').onclick = () => $('#app').classList.remove('mopen');
$('#theme').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; try { localStorage.setItem('guaruma.theme', r.dataset.theme); } catch (_) {} };
$('#q').addEventListener('keydown', (e) => { if (e.key !== 'Enter') return; const q = e.target.value.trim().toLowerCase(); if (!q) return; const f = F.find((x) => (x.Frente + ' ' + x['Proveedor / contraparte']).toLowerCase().includes(q)); if (f) location.hash = 'frente-' + f.ID; else { const c = C.find((x) => (x['N.º'] + ' ' + x.Contratista).toLowerCase().includes(q)); if (c) location.hash = 'frente-' + c.Frente; } });

// ---------- Tooltip ----------
const tip = $('#tip'); let tipEl = null;
function showTip(el) {
  const txt = el.dataset.tip || (document.getElementById('app').classList.contains('collapsed') ? el.dataset.tipC : null);
  if (!txt) return; tipEl = el; tip.innerHTML = txt; tip.classList.add('on');
  const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  let x, y;
  if (el.dataset.tipC && !el.dataset.tip) { x = r.right + 10; y = r.top + r.height / 2 - t.height / 2; }
  else { x = r.left + r.width / 2 - t.width / 2; y = r.top - t.height - 8; if (y < 8) y = r.bottom + 8; }
  x = Math.max(8, Math.min(innerWidth - t.width - 8, x));
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
const hideTip = () => { tip.classList.remove('on'); tipEl = null; };
document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-tip],[data-tip-c]'); if (el && el !== tipEl) showTip(el); else if (!el) hideTip(); });
document.addEventListener('focusin', (e) => { const el = e.target.closest('[data-tip],[data-tip-c]'); if (el) showTip(el); });
document.addEventListener('focusout', hideTip); addEventListener('scroll', hideTip, true);


// ================= Asana (en vivo, opcional) =================
const ASANA_PROJECT = '1219127034886298'; // "Resumen Proyecto Solar CAHSA"
const ASANA_KEY = 'guaruma.asana.pat';
const ASANA = { pat: (() => { try { return localStorage.getItem(ASANA_KEY) || ''; } catch (_) { return ''; } })(), live: false, at: null, err: null, form: false };
// Plazos que se comparan con una tarea de Asana (por nombre)
const PZ_ASANA = { PZ1: 'estudios de suelos', PZ2: 'ingeniería básica', PZ7: 'licencia ambiental' };
const norm = (t) => String(t || '').toLowerCase().replace(/\s+/g, ' ').trim();
async function asanaGet(path) {
  const r = await fetch('https://app.asana.com/api/1.0' + path, { headers: { Authorization: 'Bearer ' + ASANA.pat, Accept: 'application/json' } });
  if (!r.ok) { let m = 'HTTP ' + r.status; try { const j = await r.json(); m = (j.errors && j.errors[0] && j.errors[0].message) || m; } catch (_) {} throw new Error(r.status === 401 ? 'El token no es válido o expiró' : m); }
  return r.json();
}
async function loadAsana() {
  if (!ASANA.pat) { ASANA.live = false; return; }
  try {
    const [secs, tasks] = await Promise.all([
      asanaGet(`/projects/${ASANA_PROJECT}/sections?opt_fields=name&limit=100`),
      asanaGet(`/projects/${ASANA_PROJECT}/tasks?opt_fields=name,start_on,due_on,completed,assignee.name,memberships.section.name,memberships.project.gid&limit=100`)
    ]);
    const order = (secs.data || []).map((x) => x.name.replace(/:\s*$/, '').trim());
    const rows = (tasks.data || []).map((t) => {
      const m = (t.memberships || []).find((mm) => mm.project && mm.project.gid === ASANA_PROJECT) || (t.memberships || [])[0] || {};
      return { 'Sección': ((m.section && m.section.name) || 'Sin sección').replace(/:\s*$/, '').trim(), Tarea: t.name.trim(), Inicio: t.start_on || null, Fin: t.due_on || null, Completada: t.completed ? 'Sí' : 'No', Responsable: (t.assignee && t.assignee.name) || '' };
    }).filter((r) => r.Fin || r.Inicio);
    rows.sort((a, b) => (order.indexOf(a['Sección']) - order.indexOf(b['Sección'])));
    AS = rows;
    // Actualiza la comparación de plazos con las fechas vivas
    PZ.forEach((p) => { const n = PZ_ASANA[p.ID]; if (!n) return; const t = rows.find((r) => norm(r.Tarea) === n); if (t) { p['Inicio Asana'] = t.Inicio; p['Fin Asana'] = t.Fin; } });
    ASANA.live = true; ASANA.at = new Date(); ASANA.err = null;
  } catch (e) {
    ASANA.live = false; ASANA.err = (e instanceof TypeError) ? 'El navegador no pudo conectarse a Asana (bloqueo de conexión directa o sin internet)' : e.message;
  }
}
function asanaSourceText() {
  if (ASANA.live) return `<span class="src-live">En vivo desde Asana</span> · "Resumen Proyecto Solar CAHSA" · leído a las ${ASANA.at.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' })}`;
  if (ASANA.pat && ASANA.err) return `<span class="src-err">No se pudo leer Asana:</span> ${esc(ASANA.err)}. Se muestra la copia del Excel maestro.`;
  return 'Copia del Excel maestro (hoja "Cronograma Asana"). Conecta Asana para verlo en vivo.';
}
function asanaForm() {
  if (!ASANA.form) return '';
  return `<div class="asana-form"><b>Conexión con Asana</b>
    <p>Pega tu token personal de Asana (Asana → foto de perfil → Configuración → Aplicaciones → Administrar aplicaciones de desarrollador → Crear nuevo token). Se guarda solo en este navegador; no se sube a GitHub ni al Excel.</p>
    <div class="row"><input id="asana-pat" type="password" autocomplete="off" placeholder="${ASANA.pat ? 'Token guardado · pega uno nuevo para reemplazarlo' : 'Pega aquí el token'}"><button class="btn primary sm" type="button" data-asana-save="1">Guardar y conectar</button>${ASANA.pat ? '<button class="btn sm" type="button" data-asana-del="1">Desconectar</button>' : ''}<button class="btn sm" type="button" data-asana-cfg="1">Cerrar</button></div></div>`;
}
async function asanaClick(e) {
  if (e.target.closest('[data-asana-cfg]')) { ASANA.form = !ASANA.form; render(); return true; }
  if (e.target.closest('[data-asana-del]')) { ASANA.pat = ''; try { localStorage.removeItem(ASANA_KEY); } catch (_) {} ASANA.live = false; ASANA.err = null; ASANA.form = false; applyData(DATA); render(); toast('Asana desconectado. Se muestra la copia del Excel.'); return true; }
  if (e.target.closest('[data-asana-save]')) {
    const v = ($('#asana-pat') || {}).value; if (!v || !v.trim()) { toast('Pega el token primero.'); return true; }
    ASANA.pat = v.trim(); try { localStorage.setItem(ASANA_KEY, ASANA.pat); } catch (_) {}
    toast('Conectando con Asana…'); await loadAsana(); ASANA.form = !ASANA.live; render();
    toast(ASANA.live ? 'Asana conectado. El cronograma ya está en vivo.' : 'No se pudo conectar: ' + ASANA.err);
    return true;
  }
  return false;
}

// ================= Microsoft (MSAL + Graph) =================
const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');
let MS = null;
async function token() {
  const req = { scopes: CFG.scopes, account: ACCOUNT };
  try { return (await MS.acquireTokenSilent(req)).accessToken; }
  catch (e) { await MS.acquireTokenRedirect(req); throw new Error('Redirigiendo para iniciar sesión…'); }
}
async function graph(path, opts = {}) {
  const t = await token();
  const r = await fetch(path.startsWith('http') ? path : GRAPH + path, { ...opts, headers: { Authorization: 'Bearer ' + t, ...(opts.body ? { 'Content-Type': 'application/json' } : {}), ...(opts.headers || {}) } });
  if (!r.ok) { let m = r.status + ''; try { const j = await r.json(); m = (j.error && j.error.message) || m; } catch (_) {} const er = new Error(m); er.status = r.status; throw er; }
  const ct = r.headers.get('content-type') || '';
  return opts.raw ? r : ct.includes('json') ? r.json() : r;
}
async function openFolderWeb(rel) {
  try { const r = await graph(`${BASE}/root:/${encPath(joinRel(CFG.root, rel))}?$select=webUrl`); window.open(r.webUrl, '_blank', 'noopener'); }
  catch (e) { toast('No se pudo abrir la carpeta: ' + e.message); }
}
// Excel maestro -> objetos
const DATE_COLS = new Set(['Fecha límite', 'Inicio', 'Fin previsto', 'Fecha próximo hito', 'Fecha firma', 'Fecha de pago', 'Fecha', 'Fecha de emisión', 'Fecha de inicio', 'Fin estimado', 'Fin máximo', 'Inicio Asana', 'Fin Asana', 'Fin']);
const serial = (n) => new Date(Math.round((n - 25569) * 864e5)).toISOString().slice(0, 10);
function readSheet(wb, name) {
  const ws = wb.Sheets[name]; if (!ws) return [];
  const rows = XLSX.utils.sheet_to_json(ws, { range: 3, raw: true, defval: null });
  return rows.filter((r) => Object.values(r).some((v) => v !== null && v !== '')).map((r) => {
    const o = {}; for (const [k, v] of Object.entries(r)) o[k] = (DATE_COLS.has(k) && typeof v === 'number') ? serial(v) : (typeof v === 'string' ? v.trim() : v);
    return o;
  });
}
function parseMaster(buf) {
  const wb = XLSX.read(buf, { type: 'array' });
  const D = {};
  for (const n of ['Frentes', 'Contratos', 'Pagos', 'Ofertas', 'Presupuesto', 'Actividades', 'Riesgos', 'Pendientes', 'Informes', 'Plazos', 'Cronograma Asana', 'Bitácora']) D[n] = readSheet(wb, n);
  D.Proyecto = Object.fromEntries(readSheet(wb, 'Proyecto').map((r) => [r.Campo, r.Valor]));
  return D;
}
async function locateMaster() {
  const p = encPath(joinRel(CFG.root, CFG.master));
  try { return await graph(`${BASE}/root:/${p}?$select=id,lastModifiedDateTime,lastModifiedBy,webUrl`); }
  catch (e) { if (BASE !== '/me/drive' && (e.status === 404 || e.status === 403 || e.status === 400)) { BASE = '/me/drive'; return graph(`${BASE}/root:/${p}?$select=id,lastModifiedDateTime,lastModifiedBy,webUrl`); } throw e; }
}
let loading = false;
async function load() {
  if (loading) return; loading = true; setSync('busy', 'Actualizando…');
  try {
    const it = await locateMaster();
    const r = await graph(`${BASE}/items/${it.id}/content`, { raw: true });
    const D = parseMaster(await r.arrayBuffer());
    META = { at: it.lastModifiedDateTime, by: it.lastModifiedBy && it.lastModifiedBy.user && it.lastModifiedBy.user.displayName, url: it.webUrl, synced: new Date().toISOString() };
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ D, META })); } catch (_) {}
    applyData(D); await loadAsana(); hideGate(); render(); stampSync();
  } catch (e) {
    console.error(e);
    if (DATA) { setSync('err', 'Sin conexión · datos guardados'); toast('No se pudo actualizar: ' + e.message); }
    else gateMsg('No se pudo leer el archivo maestro: ' + e.message);
  } finally { loading = false; }
}
function stampSync() {
  if (!META) return;
  const d = new Date(META.at), hh = d.toLocaleTimeString('es-HN', { hour: '2-digit', minute: '2-digit' });
  setSync('ok', `Archivo del ${fd(META.at.slice(0, 10))}, ${hh}`);
  $('#sync').dataset.tip = `<b>Archivo maestro</b>Última modificación: ${fd(META.at.slice(0, 10), 1)} ${hh}${META.by ? ' por ' + esc(META.by) : ''}<br>Toca para actualizar.`;
}
function setSync(cls, txt) { const b = $('#sync'); b.className = 'sync ' + cls; $('#sync-t').textContent = txt; }
function hideGate() { $('#gate').hidden = true; }
function gateMsg(m, showLogin) { $('#gate').hidden = false; $('#gate-msg').textContent = m || ''; $('#gate-spin').hidden = !!showLogin; $('#login').hidden = !showLogin; }
let toastT; function toast(m) { let el = $('#toast'); if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'tip'; el.style.cssText = 'left:50%;bottom:24px;top:auto;transform:translateX(-50%);max-width:420px;pointer-events:auto'; document.body.append(el); } el.textContent = m; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), 5000); }
function showUser() {
  if (!ACCOUNT) return; const n = ACCOUNT.name || ACCOUNT.username;
  $('#u-name').textContent = n; $('#u-mail').textContent = ACCOUNT.username;
  $('#u-ini').textContent = n.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
}
$('#sync').onclick = load; $('#refresh').onclick = () => { Object.keys(DOCSTATE).forEach((k) => delete DOCSTATE[k]); load(); };
$('#user').onclick = () => { if (confirm('¿Cerrar sesión?')) MS.logoutRedirect({ account: ACCOUNT }); };
$('#login').onclick = () => MS.loginRedirect({ scopes: CFG.scopes, prompt: 'select_account' });

try { const th = localStorage.getItem('guaruma.theme'); if (th) document.documentElement.dataset.theme = th; } catch (_) {}
async function boot() {
  try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.D) { applyData(c.D); META = c.META; } } catch (_) {}
  if (!window.msal || !window.XLSX) { gateMsg('No se pudieron cargar las librerías. Revisa la conexión a internet.'); if (DATA) { hideGate(); render(); setSync('err', 'Sin conexión · datos guardados'); } return; }
  MS = new msal.PublicClientApplication({ auth: { clientId: CFG.clientId, authority: `https://login.microsoftonline.com/${CFG.tenantId}`, redirectUri: location.origin + location.pathname }, cache: { cacheLocation: 'localStorage' } });
  await MS.initialize();
  try { const r = await MS.handleRedirectPromise(); if (r && r.account) ACCOUNT = r.account; } catch (e) { gateMsg('Error de inicio de sesión: ' + e.message, true); return; }
  ACCOUNT = ACCOUNT || MS.getAllAccounts()[0] || null;
  if (!ACCOUNT) { gateMsg('', true); return; }
  MS.setActiveAccount(ACCOUNT); showUser();
  if (DATA) { hideGate(); render(); stampSync(); }
  load();
}
boot();
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
